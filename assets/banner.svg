<svg width="1000" height="220" viewBox="0 0 1000 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="个人横幅">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#132f4c"/>
      <stop offset="100%" stop-color="#1f6feb"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#79c0ff"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="220" fill="url(#bg)"/>

  <!-- 网格装饰 -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="55" x2="1000" y2="55"/>
    <line x1="0" y1="110" x2="1000" y2="110"/>
    <line x1="0" y1="165" x2="1000" y2="165"/>
    <line x1="250" y1="0" x2="250" y2="220"/>
    <line x1="500" y1="0" x2="500" y2="220"/>
    <line x1="750" y1="0" x2="750" y2="220"/>
  </g>

  <!-- 圆点装饰 -->
  <g fill="#58a6ff" opacity="0.35">
    <circle cx="80" cy="45" r="3"/>
    <circle cx="180" cy="170" r="2"/>
    <circle cx="320" cy="30" r="2.5"/>
    <circle cx="700" cy="185" r="3"/>
    <circle cx="860" cy="60" r="2"/>
    <circle cx="940" cy="150" r="2.5"/>
  </g>

  <!-- 终端提示符装饰 -->
  <text x="70" y="60" font-family="Consolas, monospace" font-size="18" fill="#58a6ff">~/portfolio $</text>

  <!-- 主标题：改成你的名字 -->
  <text x="500" y="110" text-anchor="middle" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="46" font-weight="bold" fill="#ffffff">ldjiuuu</text>

  <!-- 副标题 -->
  <text x="500" y="155" text-anchor="middle" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" fill="#d0e7ff">东南大学 · 计算机科学与技术</text>
  <text x="500" y="185" text-anchor="middle" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#8bb8e8">Southeast University · Computer Science &amp; Technology</text>

  <!-- 下划线装饰 -->
  <rect x="350" y="200" width="300" height="3" rx="1.5" fill="url(#accent)"/>
</svg>
